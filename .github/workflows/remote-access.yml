name: Remote access build
on:
  push:
    branches: [remote-access]
permissions:
  contents: read
jobs:
  server-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: remote-server
      - name: Compile and test transport
        run: |
          touch crates/cadview-sandbox/cadview-sandbox.wasm
          cargo test -p cadview-server origin_tests
          cargo test -p cadview-server framing_tests
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: remote-package
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.121
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: extractions/setup-just@v2
      - run: cd web && pnpm install --frozen-lockfile
      - name: Build browser and sandbox
        run: |
          just build-wasm build-web
          bash sandbox-component/build.sh
      - name: Build server
        run: cargo build --release -p cadview-server --features embedded-dist
      - name: Package artifact
        run: |
          mkdir -p artifact
          cp target/release/cadview-server artifact/codecad
          cp Cargo.lock artifact/Cargo.lock
          (cd artifact && sha256sum codecad > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: codecad-linux-x86_64
          path: artifact/
